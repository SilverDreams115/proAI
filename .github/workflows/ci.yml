name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c backend/constraints.txt -e "./backend[dev]"

      - name: Lint, typecheck, fast tests
        run: make check PYTHON=python

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c backend/constraints.txt -e "./backend[dev]"

      - name: Integration tests
        run: make test-integration PYTHON=python

  backend-slow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c backend/constraints.txt -e "./backend[dev]"

      - name: Slow tests
        run: make test-slow PYTHON=python

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - backend-integration
      - backend-slow
      - frontend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the standalone image used by the healthcheck smoke below,
      # AND build BOTH compose services (proai + worker) so any
      # divergence between them — worker has a different command/entry
      # path — fails CI rather than slipping to prod. Local dev relies
      # on `make rebuild` to do the same thing.
      - name: Build standalone image
        run: docker build -t proai:ci .

      - name: Build both compose services (proai + worker)
        run: docker compose build proai worker

      - name: Run image healthcheck
        run: |
          docker run -d --rm --name proai-ci \
            -e PROAI_AUTH_API_KEY=ci-secret \
            -e PROAI_AUTH_PASSWORD_HASH='pbkdf2_sha256$390000$ca8d2fb5aa00353673f60720a4717bc3$8a7f2dfcaac18b46b8862a2d213cf974e4a4710849992bae8a88e5ce9c57b58f' \
            -e PROAI_SESSION_SECRET=7zP5-sT8fP4j2Dlh5UJAG924-FxNGeFINWDTeO-G0hVioOol \
            -e PROAI_ALLOWED_HOSTS=127.0.0.1,localhost \
            -p 18080:8000 proai:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/api/ready; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/api/ready
          PROAI_BASE_URL=http://127.0.0.1:18080 python backend/scripts/frontend_smoke.py
          PROAI_BASE_URL=http://127.0.0.1:18080 PROAI_LOAD_REQUESTS=40 python backend/scripts/http_load_smoke.py
          docker inspect --format '{{json .State.Health}}' proai-ci
          docker stop proai-ci

      - name: Validate production compose
        run: |
          cp .env.example .env
          sed -i 's|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-db-credential-1234567890|' .env
          sed -i 's|proai:proai@postgres|proai:ci-db-credential-1234567890@postgres|' .env
          sed -i 's|PROAI_AUTH_API_KEY=.*|PROAI_AUTH_API_KEY=ci-auth-key-1234567890-abcdef|' .env
          # Single-quoted so the shell leaves the $ segments alone: this is a
          # literal YAML block, so a double-quoted sed script had $3 expand to
          # an empty positional parameter and left sed reading \9 as a
          # backreference. `$` is not special in a sed replacement.
          # The $ are doubled because compose interpolates .env values: with a
          # single $, `$ca8d...` resolved to an unset variable and the salt
          # disappeared from the hash entirely. Compose unescapes $$ back to $
          # when it hands the value to the container.
          sed -i 's|PROAI_AUTH_PASSWORD_HASH=.*|PROAI_AUTH_PASSWORD_HASH=pbkdf2_sha256$$390000$$ca8d2fb5aa00353673f60720a4717bc3$$8a7f2dfcaac18b46b8862a2d213cf974e4a4710849992bae8a88e5ce9c57b58f|' .env
          sed -i 's|PROAI_SESSION_SECRET=.*|PROAI_SESSION_SECRET=7zP5-sT8fP4j2Dlh5UJAG924-FxNGeFINWDTeO-G0hVioOol|' .env
          docker compose -f docker-compose.prod.yml config > /tmp/proai-prod-compose.yaml

      - name: Smoke production stack
        run: |
          cp .env.example .env
          sed -i 's|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-db-credential-1234567890|' .env
          sed -i 's|proai:proai@postgres|proai:ci-db-credential-1234567890@postgres|' .env
          sed -i 's|PROAI_AUTH_API_KEY=.*|PROAI_AUTH_API_KEY=ci-auth-key-1234567890-abcdef|' .env
          # Single-quoted so the shell leaves the $ segments alone: this is a
          # literal YAML block, so a double-quoted sed script had $3 expand to
          # an empty positional parameter and left sed reading \9 as a
          # backreference. `$` is not special in a sed replacement.
          # The $ are doubled because compose interpolates .env values: with a
          # single $, `$ca8d...` resolved to an unset variable and the salt
          # disappeared from the hash entirely. Compose unescapes $$ back to $
          # when it hands the value to the container.
          sed -i 's|PROAI_AUTH_PASSWORD_HASH=.*|PROAI_AUTH_PASSWORD_HASH=pbkdf2_sha256$$390000$$ca8d2fb5aa00353673f60720a4717bc3$$8a7f2dfcaac18b46b8862a2d213cf974e4a4710849992bae8a88e5ce9c57b58f|' .env
          sed -i 's|PROAI_SESSION_SECRET=.*|PROAI_SESSION_SECRET=7zP5-sT8fP4j2Dlh5UJAG924-FxNGeFINWDTeO-G0hVioOol|' .env
          # Caddy turns on automatic HTTPS for a bare hostname and redirects
          # HTTP to it, signing with its internal CA. curl without -L silently
          # accepted the 308, but frontend_smoke uses urllib, which follows the
          # redirect and then cannot validate that CA:
          #   URLError: [SSL: TLSV1_ALERT_INTERNAL_ERROR]
          # An `http://` prefixed site address makes Caddy serve plain HTTP and
          # skip the redirect. Production sets a real hostname and keeps TLS.
          sed -i 's|PROAI_PUBLIC_HOSTNAME=.*|PROAI_PUBLIC_HOSTNAME=http://localhost|' .env
          docker compose -f docker-compose.prod.yml up -d
          # Address the stack by the hostname Caddy actually serves. Hitting
          # 127.0.0.1 sends a Host header that matches no site block, so Caddy
          # answered with a page that had none of the app's assets in it and
          # frontend_smoke reported them all missing.
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost/api/ready; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost/api/ready
          curl -fsS http://localhost/api/metrics -H 'X-API-Key: ci-auth-key-1234567890-abcdef' > /tmp/proai-metrics.txt
          curl -fsS http://localhost/api/operations/publication-gate -H 'X-API-Key: ci-auth-key-1234567890-abcdef' > /tmp/proai-publication-gate.json
          PROAI_BASE_URL=http://localhost python backend/scripts/frontend_smoke.py
          PROAI_BASE_URL=http://127.0.0.1 PROAI_AUTH_API_KEY=ci-auth-key-1234567890-abcdef PROAI_LOAD_REQUESTS=40 python backend/scripts/http_load_smoke.py
          docker inspect --format '{{json .State.Health}}' proai-backup
          docker inspect --format '{{json .State.Health}}' proai-worker
          docker compose -f docker-compose.prod.yml down
